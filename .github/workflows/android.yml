name: Android APK (Ujian Aman)

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Runner GitHub sudah membawa Android SDK; cukup menerima lisensi agar Gradle boleh memasang platform/build-tools yang kurang
      - name: Terima lisensi Android SDK
        run: yes | "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager --licenses > /dev/null || true

      - name: Tes unit dan bangun APK rilis
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleRelease

      - name: Unggah APK
        uses: actions/upload-artifact@v4
        with:
          name: ujian-aman-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
